name: Build Android APK
on:
  push:
    branches: [main]
    paths: ["android/**", "index.html", ".github/workflows/build-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Bundle the web app inside the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Jarvis.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest Jarvis.apk --target "${{ github.sha }}" --title "Jarvis Android app" --notes "Download Jarvis.apk on your Android phone, open it and tap Install."
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
